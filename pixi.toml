[workspace]
authors = ["Eric Page <genamthi@gmail.com>"]
channels = ["conda-forge"]
name = "funbuns"
platforms = ["linux-64"]
version = "1.1.0"

[tasks]
# Infrastructure (funbuns-admin)
serve = "funbuns-admin serve"
notebook = "funbuns-admin notebook"
build-db = "funbuns-admin db build"
sync-db = "funbuns-admin db sync"
db-status = "funbuns-admin db status"

# Block management (bmgr)
bmgr = "python -m funbuns.block_manager"
bmgr-integrate = "python -m funbuns.block_manager --integrate-check"
bmgr-integrity = "python -m funbuns.block_manager --integrity"
bmgr-diagnose = "python -m funbuns.block_manager --diagnose"
bmgr-show-runs = "python -m funbuns.block_manager --show-runs"

# Analysis (funbuns)
ladic = "funbuns --ladic"
remainder = "funbuns --remainder"
zipf = "funbuns --zipf"
spectral = "funbuns --spectral"
explore = "funbuns --explore"
local-global = "funbuns --local-global --explore-q 3"
baker-circle = "funbuns --baker-circle 149"

# Build
build-native = "cd funbuns_native && cargo build --release"
build-graph-bin = "cd funbuns_graph && cargo build --release"
build-graph = "scripts/build_graph.sh"

[dependencies]

altair = ">=6.0.0,<7"
tqdm = ">=4.67.3,<5"
psutil = ">=7.2.2,<8"
polars = ">=1.38.1,<2"
py-spy = ">=0.4.1,<0.5"
python = "==3.12"
pytest = ">=9.0.2,<10"
pytest-mock = ">=3.15.1,<4"
sage = ">=10.7,<11"
vulture = ">=2.16,<3"

[tool.funbuns]
buffer_size = 10_000_000
small_primes_filename = "small_primes.parquet"
lim_sm_p = 100000
max_power = 64
web_port = 8081
notebook_port = 8888

[tool.funbuns.directories]
data_dir = "/media/extssd/research/dioph.pp/data"
db_path = "/media/extssd/research/dioph.pp/data/funbuns.duckdb"
log_dir = "logs"


[pypi-dependencies]
funbuns = { path = ".", editable = true }
giotto-ph = ">=0.2.4, <0.3"
duckdb = ">=1.5.0, <2"
fastapi = ">=0.115"
uvicorn = ">=0.34"
vegafusion = {version = ">=2.0", extras = ["embed"]}
vl-convert-python = ">=1.8.0"
anywidget = ">=0.9"
pyarrow = ">=18.0"

[environments]
dev = ["dev"]

[feature.dev.tasks]
# Composable: scripts/profile.sh <pyspy|trace|instr> <command> [args...]
profile = "scripts/profile.sh"

# Shortcuts for common profiling targets
profile-ladic = "scripts/profile.sh pyspy funbuns --ladic"
profile-remainder = "scripts/profile.sh pyspy funbuns --remainder"
trace-ladic = "scripts/profile.sh trace funbuns --ladic"
trace-remainder = "scripts/profile.sh trace funbuns --remainder"

[feature.dev.dependencies]
pyinstrument = "*"

[feature.dev.pypi-dependencies]
viztracer = "*"
