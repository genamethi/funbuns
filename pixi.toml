[workspace]
authors = ["Eric Page <genamthi@gmail.com>"]
channels = ["conda-forge"]
name = "funbuns"
platforms = ["linux-64"]
version = "1.1.0"
repository = "https://github.com/genamethi/funbuns"

[tasks]
notebook = "funbuns-admin notebook"
[tasks.hive]
cmd = "docker compose up"
cwd = "docker/hive"



[tasks.hive.env]
HIVE_VERSION = "4.2.0"
DEFAULT_FS = "file:///"
HIVE_WAREHOUSE_PATH = "/media/extssd/research/dioph.pp/data/iceberg/warehouse"



[dependencies]

altair = ">=6.0.0,<7"
tqdm = ">=4.67.3,<5"
psutil = ">=7.2.2,<8"
polars = ">=1.38.1,<2"
py-spy = ">=0.4.1,<0.5"
python = "==3.12"
pytest = ">=9.0.2,<10"
pytest-mock = ">=3.15.1,<4"
sage = ">=10.7,<11"
vulture = ">=2.16,<3"
pyiceberg = ">=0.11.1,<0.12"
sqlalchemy = ">=2.0.49,<3"
duckdb = ">=1.5.0, <2"
fastapi = ">=0.115"
uvicorn = ">=0.34"
vegafusion = ">=2.0"
vl-convert-python = ">=1.8.0"
anywidget = ">=0.9"
pyarrow = ">=18.0"
thrift = ">=0.22.0,<0.23"

[tool.funbuns]
buffer_size = 10_000_000
small_primes_filename = "small_primes.parquet"
lim_sm_p = 100000
max_power = 64
notebook_port = 8888

[tool.funbuns.directories]
data_dir = "/media/extssd/research/dioph.pp/data"
db_path = "/media/extssd/research/dioph.pp/data/funbuns.duckdb"
iceberg_dir = "/media/extssd/research/dioph.pp/data/iceberg"
log_dir = "logs"

[pypi-dependencies]
#TODO move these to conda-forge dependencies where possible.
#I suspect many of these are in conda-forge, but an agent added them with pypi accidentally.
#giotto-ph and the local install are clear exceptions, they belong here.
funbuns = { path = ".", editable = true }
giotto-ph = ">=0.2.4, <0.3"
pyhive = ">=0.7.0, <0.8"
thrift-sasl = ">=0.4.3, <0.5"
pure-sasl = ">=0.6.2, <0.7"

[environments]
dev = ["dev"]

[feature.dev.tasks]
# Composable: scripts/profile.sh <pyspy|trace|instr> <command> [args...]
profile = "scripts/profile.sh"

# Shortcuts for common profiling targets
profile-ladic = "scripts/profile.sh pyspy funbuns --ladic"
profile-remainder = "scripts/profile.sh pyspy funbuns --remainder"
trace-ladic = "scripts/profile.sh trace funbuns --ladic"
trace-remainder = "scripts/profile.sh trace funbuns --remainder"

[feature.dev.dependencies]
pyinstrument = "*"

[feature.dev.pypi-dependencies]
viztracer = "*"
