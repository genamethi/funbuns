[package]
name = "funbuns_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "funbuns_native"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "0.46", default-features = false }
pyo3 = { version = "0.23", features = ["extension-module"] }
pyo3-polars = { version = "0.21", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
